<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Medical SEO</title>

    <link
      rel="shortcut icon"
      href="./docwind-icon.jpg"
    />

    <meta
      name="description"
      content="Stay ahead of the competition with our SEO services for medical practices. Increase visibility, attract more patients, and grow your business online."
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      property="og:description"
      content="Stay ahead of the competition with our SEO services for medical practices. Increase visibility, attract more patients, and grow your business online."
    />
    <meta property="og:title" content="Medical SEO" />
    <meta
      name="twitter:description"
      content="Stay ahead of the competition with our SEO services for medical practices. Increase visibility, attract more patients, and grow your business online."
    />

    <style>
      a.cta_button {
        -moz-box-sizing: content-box !important;
        -webkit-box-sizing: content-box !important;
        box-sizing: content-box !important;
        vertical-align: middle;
      }
      .hs-breadcrumb-menu {
        list-style-type: none;
        margin: 0px 0px 0px 0px;
        padding: 0px 0px 0px 0px;
      }
      .hs-breadcrumb-menu-item {
        float: left;
        padding: 10px 0px 10px 10px;
      }
      .hs-breadcrumb-menu-divider:before {
        content: "›";
        padding-left: 10px;
      }
      .hs-featured-image-link {
        border: 0;
      }
      .hs-featured-image {
        float: right;
        margin: 0 0 20px 20px;
        max-width: 50%;
      }
      @media (max-width: 568px) {
        .hs-featured-image {
          float: none;
          margin: 0;
          width: 100%;
          max-width: 100%;
        }
      }
      .hs-screen-reader-text {
        clip: rect(1px, 1px, 1px, 1px);
        height: 1px;
        overflow: hidden;
        position: absolute !important;
        width: 1px;
      }
    </style>

    <style>
      /* Settings */

      :root {
        /* HubSpot DND layout grid */
        --hsElevate--column__gap: 2.13%;
        --hsElevate--column__widthMultiplier: 8.333;

        /* Sections */
        --hsElevate--contentWrapper--narrow__maxWidth: 768px;
        --hsElevate--contentWrapper--medium__maxWidth: 1120px;
        --hsElevate--contentWrapper--wide__maxWidth: 1296px;

        --hsElevate--section--extraSmall__verticalPadding: 48px;
        --hsElevate--section--small__verticalPadding: 64px;
        --hsElevate--section--medium__verticalPadding: 96px;
        --hsElevate--section--large__verticalPadding: 128px;
        --hsElevate--section--extraLarge__verticalPadding: 192px;

        /* Default section left/right padding */
        --hsElevate--section--horizontalPadding: 32px;

        /* Gap - default gaps that could be easily leveraged in module styles via class names */
        --hsElevate--gap--extraSmall: 16px;
        --hsElevate--gap--small: 24px;
        --hsElevate--gap--medium: 32px;
        --hsElevate--gap--large: 64px;
        --hsElevate--gap--extraLarge: 96px;

        /* Spacing - default spacing values  */
        --hsElevate--spacing--4: 4px;
        --hsElevate--spacing--8: 8px;
        --hsElevate--spacing--12: 12px;
        --hsElevate--spacing--16: 16px;
        --hsElevate--spacing--20: 20px;
        --hsElevate--spacing--24: 24px;
        --hsElevate--spacing--32: 32px;
        --hsElevate--spacing--40: 40px;
        --hsElevate--spacing--48: 48px;
        --hsElevate--spacing--56: 56px;
        --hsElevate--spacing--64: 64px;
        --hsElevate--spacing--72: 72px;
        --hsElevate--spacing--80: 80px;
        --hsElevate--spacing--88: 88px;
        --hsElevate--spacing--96: 96px;
        --hsElevate--spacing--104: 104px;
        --hsElevate--spacing--112: 112px;
        --hsElevate--spacing--120: 120px;
        --hsElevate--spacing--128: 128px;
        --hsElevate--spacing--136: 136px;
        --hsElevate--spacing--144: 144px;
        --hsElevate--spacing--152: 152px;
        --hsElevate--spacing--160: 160px;
        --hsElevate--spacing--168: 168px;
        --hsElevate--spacing--176: 176px;
        --hsElevate--spacing--184: 184px;
        --hsElevate--spacing--192: 192px;

        /* Grids */
        --default-section-padding: var(
            --hsElevate--section--medium__verticalPadding
          )
          var(--hsElevate--section--horizontalPadding);
        --default-section-margin: 0;
        --default-section-max-width: var(
          --hsElevate--contentWrapper--wide__maxWidth
        );
        --default-container-padding: 0;
        --default-container-margin: 0;
        --default-container-gap: var(--hsElevate--gap--medium);
        --default-container-row-gap: var(--hsElevate--gap--medium);
        --default-container-column-gap: var(--hsElevate--gap--medium);
        --default-table-padding: 0;
        --default-table-margin: 0;
        --default-table-row-gap: var(--hsElevate--gap--medium);
        --default-table-column-gap: var(--hsElevate--gap--medium);
      }

      :root {
        /* Text spacing */

        --hsElevate--text--extraSmall__margin: 0 0.75rem; /* 12px */
        --hsElevate--text--small__margin: 0 1.25rem; /* 20px */
        --hsElevate--text__margin: 0 2rem; /* 32px */
        --hsElevate--text--large__margin: 0 2.5rem; /* 40px */
        --hsElevate--text--extraLarge__margin: 0 4rem; /* 64px */

        /* Body */

        --hsElevate--baseText__fontSize: 16px;
        --hsElevate--body__font: Inter;
        --hsElevate--body--small__fontSize: 1.000125rem;
        --hsElevate--body__fontSize: 1.125rem;
        --hsElevate--body--large__fontSize: 1.499625rem;
        --hsElevate--body--extraLarge__fontSize: 1.9991249999999998rem;
        --hsElevate--body__fontWeight: normal;
        --hsElevate--body__fontStyle: normal;
        --hsElevate--body__lineHeight: 1.55;

        /* Primary links */

        --hsElevate--link--primary__fontColor: #009cde;

        --hsElevate--link--primary__textDecoration: none;
        --hsElevate--link--primary__textDecorationColor: transparent;

        /* Hover state */

        --hsElevate--link--primary__hover--fontColor: #28292c;

        --hsElevate--link--primary__hover--textDecoration: underline;
        --hsElevate--link--primary__hover--textDecorationColor: #f7f9fc;

        /* Secondary links */

        --hsElevate--link--secondary__fontColor: #ffb718;

        --hsElevate--link--secondary__textDecoration: none;
        --hsElevate--link--secondary__textDecorationColor: transparent;

        /* Hover state */

        --hsElevate--link--secondary__hover--fontColor: #ffb718;

        --hsElevate--link--secondary__hover--textDecoration: underline;
        --hsElevate--link--secondary__hover--textDecorationColor: #ffb718;

        /* Headings */

        /* Percentage change for the heading font sizes on mobile */
        --hsElevate--heading__tablet-modifier: 0.8;

        --hsElevate--heading__lineHeight: 1.2;

        --hsElevate--display1__font: Inter;
        --hsElevate--display1__fontSize: 6.313rem;

        --hsElevate--display2__font: Inter;
        --hsElevate--display2__fontSize: 4.75rem;

        --hsElevate--h1__font: Inter;
        --hsElevate--h1__fontSize: 3.5625rem;
        --hsElevate--h1__fontWeight: 500;
        --hsElevate--h1__fontStyle: normal;

        --hsElevate--h2__font: Inter;
        --hsElevate--h2__fontSize: 2.6875rem;
        --hsElevate--h2__fontWeight: 600;
        --hsElevate--h2__fontStyle: normal;

        --hsElevate--h3__font: Inter;
        --hsElevate--h3__fontSize: 2rem;
        --hsElevate--h3__fontWeight: 600;
        --hsElevate--h3__fontStyle: normal;

        --hsElevate--h4__font: Inter;
        --hsElevate--h4__fontSize: 1.5rem;
        --hsElevate--h4__fontWeight: 600;
        --hsElevate--h4__fontStyle: normal;

        --hsElevate--h5__font: Inter;
        --hsElevate--h5__fontSize: 1.25rem;
        --hsElevate--h5__fontWeight: 600;
        --hsElevate--h5__fontStyle: normal;

        --hsElevate--h6__font: Inter;
        --hsElevate--h6__fontSize: 1rem;
        --hsElevate--h6__fontWeight: 600;
        --hsElevate--h6__fontStyle: normal;

        /* Quotes */

        --hsElevate--quotes__font: Inter;
        --hsElevate--quotes__fontColor:    ;
        --hsElevate--quotes__fontSize: 1.125rem;
        --hsElevate--quotes__fontWeight: 400;
        --hsElevate--quotes__fontStyle: normal;

        /* Captions */

        --hsElevate--captions__font: Inter;
        --hsElevate--captions__fontSize: 0.75rem;
        --hsElevate--captions__fontWeight: 800;
        --hsElevate--captions__fontStyle: normal;
        --hsElevate--captions__case: uppercase;

        /* Images */

        --hsElevate--rteImages__margin: 2rem; /* 32px */
      }

      :root {
        /* Base colors */
        --hsElevate--color--base--1: #ffffff;
        --hsElevate--color--base--2: #f7f9fc;
        --hsElevate--color--base--3: #25252c;

        /* Accent colors */
        --hsElevate--color--accent--1: #74af0d;
        --hsElevate--color--accent--2: #ffb718;
        --hsElevate--color--accent--3: #f7f9fc;
      }

      :root {
        /* Primary button variables  */
        --hsElevate--button--primary__buttonFill: filled;

        /* Primary button font */
        --hsElevate--button--primary__font: Inter;
        /*
    TODO: Look into why primary_button.text.size ~ primary_button.text.size_unit
    is not evaluating to the correct size_unit, but can still take in px
  */
        --hsElevate--button--primary__fontSize: 1rem;
        --hsElevate--button--primary__fontWeight: 500;
        --hsElevate--button--primary__fontStyle: normal;

        /* Primary button text color */
        --hsElevate--button--primary__textColor: #25252c;
        --hsElevate--button--primary__hover--textColor: #f7f9fc;

        /* Primary button shape */

        --hsElevate--button--primary__borderRadius: 8px;

        /* Primary button background color */

        --hsElevate--button--primary__backgroundColor: #ffb718;
        --hsElevate--button--primary__hover--backgroundColor: #25252c;

        --hsElevate--button--primary__active--backgroundColor: #07070e;

        /* Primary button border */
        --hsElevate--button--primary__borderThickness: 0px;
        --hsElevate--button--primary__hover--borderThickness: 0px;

        --hsElevate--button--primary__borderColor: transparent;
        --hsElevate--button--primary__hover--borderColor: transparent;

        /* Secondary button variables  */
        --hsElevate--button--secondary__buttonFill: no_fill;

        /* Secondary button font */
        --hsElevate--button--secondary__font: Inter;
        --hsElevate--button--secondary__fontSize: 1rem;
        --hsElevate--button--secondary__fontWeight: 500;
        --hsElevate--button--secondary__fontStyle: normal;

        /* Secondary button text color */
        --hsElevate--button--secondary__textColor: #f7f9fc;
        --hsElevate--button--secondary__hover--textColor: #009cde;

        /* Secondary button shape */

        --hsElevate--button--secondary__borderRadius: 8px;

        /* Secondary button background color */

        --hsElevate--button--secondary__backgroundColor: transparent;
        --hsElevate--button--secondary__hover--backgroundColor: transparent;

        /* Secondary button border */
        --hsElevate--button--secondary__borderThickness: 2px;
        --hsElevate--button--secondary__hover--borderThickness: 2px;

        --hsElevate--button--secondary__borderColor: #f7f9fc;
        --hsElevate--button--secondary__hover--borderColor: #009cde;

        /* Tertiary button variables  */
        --hsElevate--button--tertiary__buttonFill: filled;

        /* Tertiary button font */
        --hsElevate--button--tertiary__font: Inter;
        --hsElevate--button--tertiary__fontSize: 1rem;
        --hsElevate--button--tertiary__fontWeight: 500;
        --hsElevate--button--tertiary__fontStyle: normal;

        /* Tertiary button text color */
        --hsElevate--button--tertiary__textColor: #25252c;
        --hsElevate--button--tertiary__hover--textColor: #ffffff;

        /* Tertiary button shape */

        --hsElevate--button--tertiary__borderRadius: 8px;

        /* Tertiary button background color */

        --hsElevate--button--tertiary__backgroundColor: #ffb718;
        --hsElevate--button--tertiary__hover--backgroundColor: #25252c;

        /* Tertiary button border */
        --hsElevate--button--tertiary__borderThickness: 0px;
        --hsElevate--button--tertiary__hover--borderThickness: 0px;

        --hsElevate--button--tertiary__borderColor: transparent;
        --hsElevate--button--tertiary__hover--borderColor: transparent;

        /* Accent button variables  */
        --hsElevate--button--accent__buttonFill: no_fill;

        /* Accent button font */
        --hsElevate--button--accent__font: Inter;
        --hsElevate--button--accent__fontSize: 1rem;
        --hsElevate--button--accent__fontWeight: 500;
        --hsElevate--button--accent__fontStyle: normal;

        /* Accent button text color */
        --hsElevate--button--accent__textColor: #ffb718;
        --hsElevate--button--accent__hover--textColor: #009cde;

        /* Accent button shape */

        --hsElevate--button--accent__borderRadius: 8px;

        /* Accent button background color */

        --hsElevate--button--accent__backgroundColor: transparent;
        --hsElevate--button--accent__hover--backgroundColor: transparent;

        /* Accent button border */
        --hsElevate--button--accent__borderThickness: 2px;
        --hsElevate--button--accent__hover--borderThickness: 2px;

        --hsElevate--button--accent__borderColor: #ffb718;
        --hsElevate--button--accent__hover--borderColor: #009cde;
      }

      :root {
        /* Form field background color */

        --hsElevate--formField__backgroundColor: #f7f9fc;

        /* Form field shape */

        --hsElevate--formField__borderRadius: 50px;

        /* Form field border -- multiple fields to properly handle field visibility for both fill and no fill */

        /* Proper usage of variables to achieve "All" or "Bottom" will be within CSS */

        --hsElevate--formField__borderThickness: 1px;

        --hsElevate--formField__borderTop: 1px solid #d3dae4;
        --hsElevate--formField__borderRight: 1px solid #d3dae4;
        --hsElevate--formField__borderLeft: 1px solid #d3dae4;

        --hsElevate--formField__borderBottom: 1px solid #d3dae4;
        --hsElevate--formField__borderColor: #d3dae4;

        /* Form field text color */
        --hsElevate--formFieldInput__textColor: #25252c;

        /* Form field spacing */
        --hsElevate--formField__marginBottom: var(--hsElevate--spacing--32);

        /* Form textarea border radius */
        --hsElevate--formFieldTextArea__borderRadius: calc(
          var(--hsElevate--formField__borderRadius) * 0.5
        );

        /* Form field checkbox/radio */
        --hsElevate--formFieldCheckboxRadio__size: 24px;
        --hsElevate--formFieldCheckboxRadio__fillColor: #000000;

        /* Form field placeholder */
        --hsElevate--formFieldPlaceholder__textColor: #7d8ca5;

        /* Form required field color */
        --hsElevate--formRequired__color: #de2828;

        /* Form field datepicker icon */
        --hsElevate--formField__datepickerIcon: url("data:image/svg+xml,%3Csvg width='24' height='29' viewBox='0 0 24 29' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg clip-path='url(%23clip0_3812_12272)'%3E%3Cpath d='M8.14286 2.07136C8.14286 1.35886 7.56964 0.785645 6.85714 0.785645C6.14464 0.785645 5.57143 1.35886 5.57143 2.07136V4.21422H3.42857C1.5375 4.21422 0 5.75172 0 7.64279V8.49993V11.0714V24.7856C0 26.6767 1.5375 28.2142 3.42857 28.2142H20.5714C22.4625 28.2142 24 26.6767 24 24.7856V11.0714V8.49993V7.64279C24 5.75172 22.4625 4.21422 20.5714 4.21422H18.4286V2.07136C18.4286 1.35886 17.8554 0.785645 17.1429 0.785645C16.4304 0.785645 15.8571 1.35886 15.8571 2.07136V4.21422H8.14286V2.07136ZM2.57143 11.0714H21.4286V24.7856C21.4286 25.2571 21.0429 25.6428 20.5714 25.6428H3.42857C2.95714 25.6428 2.57143 25.2571 2.57143 24.7856V11.0714Z' fill='%2309152B'/%3E%3C/g%3E%3Cdefs%3E%3CclipPath id='clip0_3812_12272'%3E%3Crect width='24' height='27.4286' fill='white' transform='translate(0 0.785645)'/%3E%3C/clipPath%3E%3C/defs%3E%3C/svg%3E%0A");

        /* Form field select icon */
        --hsElevate--formField__selectIcon: url("data:image/svg+xml,%3Csvg width='24' height='25' viewBox='0 0 24 25' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10.9407 19.5595C11.5267 20.1454 12.4782 20.1454 13.0642 19.5595L22.0642 10.5595C22.6501 9.97354 22.6501 9.02197 22.0642 8.43604C21.4782 7.8501 20.5267 7.8501 19.9407 8.43604L12.0001 16.3767L4.05947 8.44072C3.47354 7.85478 2.52197 7.85478 1.93604 8.44072C1.3501 9.02666 1.3501 9.97822 1.93604 10.5642L10.936 19.5642L10.9407 19.5595Z' fill='%2309152B'/%3E%3C/svg%3E%0A");

        /* Textarea drag icon */
        --hsElevate--formField__dragIcon: url("data:image/svg+xml,%3Csvg width='11' height='12' viewBox='0 0 22 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cline y1='-1' x2='29.5206' y2='-1' transform='matrix(-0.666795 0.745241 -0.806754 -0.590888 19.6843 0)' stroke='%23303F59' stroke-width='2'/%3E%3Cpath d='M21.0005 9.99756L10.5005 21.9976' stroke='%23303F59' stroke-width='2'/%3E%3C/svg%3E%0A");

        /* Label text */
        --hsElevate--formLabel__textColor: #25252c;
        --hsElevate--formLabel__font: Inter;
        --hsElevate--formLabel__fontSize: 1.125rem;
        --hsElevate--formLabel__fontWeight: 500;
        --hsElevate--formLabel__marginBottom: var(--hsElevate--spacing--8);

        /* Help text */
        --hsElevate--formHelpText__textColor: #647390;

        /* Form background color */

        --hsElevate--form__backgroundColor: #ffffff;

        /* Form shape */

        --hsElevate--form__borderRadius: 24px;

        /* Form border */

        --hsElevate--form__borderThickness: 1px;
        --hsElevate--form__borderColor: #d3dae4;

        /* Form spacing */
        --hsElevate--form__padding: var(--hsElevate--spacing--48);

        /* CSS variables for new forms */

        /* Global vars */
        --hsf-global__font-family: var(--hsElevate--formLabel__font);
        --hsf-global__font-size: var(--hsElevate--formLabel__fontSize);
        --hsf-global__color: var(--hsElevate--formLabel__textColor);
        --hsf-global-error__color: var(--hsElevate--formRequired__color);

        /* Form */
        --hsf-background__background-color: var(
          --hsElevate--form__backgroundColor
        );
        --hsf-background__padding: var(--hsElevate--form__padding);
        --hsf-background__border-style: solid;
        --hsf-background__border-color: var(--hsElevate--form__borderColor);
        --hsf-background__border-radius: var(--hsElevate--form__borderRadius);
        --hsf-background__border-width: var(--hsElevate--form__borderThickness);

        /* Content */
        --hsf-heading__font-family: var(--hsf-global__font-family);
        --hsf-heading__color: var(--hsf-global__color);
        --hsf-heading__text-shadow: none;
        --hsf-richtext__font-family: var(--hsf-global__font-family);
        --hsf-richtext__font-size: var(--hsf-global__font-size);
        --hsf-richtext__color: var(--hsf-global__color);

        /* Labels */
        --hsf-field-label__font-family: var(--hsf-global__font-family);
        --hsf-field-label__font-size: var(--hsf-global__font-size);
        --hsf-field-label__color: var(--hsf-global__color);
        --hsf-field-label-requiredindicator__color: var(
          --hsf-global-error__color
        );
        --hsf-module__vertical-spacing: var(
          --hsElevate--formLabel__marginBottom
        );

        /* Help text */
        --hsf-field-description__font-family: var(--hsf-global__color);
        --hsf-field-description__color: var(
          --hsElevate--formHelpText__textColor
        );

        /* Errors */
        --hsf-erroralert__font-family: var(--hsElevate--formLabel__font);
        --hsf-erroralert__color: var(--hsf-global-error__color);

        /* Field footer */
        --hsf-field-footer__font-family: var(
          --hsf-field-description__font-family
        );
        --hsf-field-footer__color: var(--hsf-field-description__color);

        /* Field */
        --hsf-field-input__font-family: var(--hsf-global__font-family);
        --hsf-field-input__background-color: var(
          --hsElevate--formField__backgroundColor
        );
        --hsf-field-input__placeholder-color: var(
          --hsElevate--formFieldPlaceholder__textColor
        );
        --hsf-field-input__border-color: var(
          --hsElevate--formField__borderColor
        );

        --hsf-field-input__border-width: var(
          --hsElevate--formField__borderThickness
        );

        --hsf-field-input__border-style: solid;
        --hsf-field-input__border-radius: var(
          --hsElevate--formField__borderRadius
        );
        --hsf-field-input__padding: var(--hsElevate--spacing--20)
          var(--hsElevate--spacing--32);
        --hsf-field-input__color: var(--hsElevate--formFieldInput__textColor);
        --hsf-row__vertical-spacing: var(--hsElevate--formField__marginBottom);
        --hsf-row__horizontal-spacing: var(--hsElevate--spacing--32);

        /* Textarea */
        --hsf-field-textarea__font-family: var(--hsf-field-input__font-family);
        --hsf-field-textarea__color: var(--hsf-field-input__color);
        --hsf-field-textarea__background-color: var(
          --hsf-field-input__background-color
        );
        --hsf-field-textarea__border-color: var(
          --hsf-field-input__border-color
        );
        --hsf-field-textarea__border-style: var(
          --hsf-field-input__border-style
        );
        --hsf-field-textarea__border-radius: var(
          --hsElevate--formFieldTextArea__borderRadius
        );
        --hsf-field-textarea__padding: var(--hsf-field-input__padding);

        /* Checkbox */
        --hsf-field-checkbox__padding: calc(
          var(--hsElevate--formFieldCheckboxRadio__size) / 2
        );
        --hsf-field-checkbox__background-color: #fff;
        --hsf-field-checkbox__color: var(
          --hsElevate--formFieldCheckboxRadio__fillColor
        );
        --hsf-field-checkbox__border-color: var(
          --hsf-field-input__border-color
        );
        --hsf-field-checkbox__border-width: 1px 1px 1px 1px;
        --hsf-field-checkbox__border-style: var(
          --hsf-field-input__border-style
        );

        /* Radio */
        --hsf-field-radio__padding: calc(
          var(--hsElevate--formFieldCheckboxRadio__size) / 2
        );
        --hsf-field-radio__background-color: #fff;
        --hsf-field-radio__color: var(

    <script>
      // Listen for Tally form submission to hide the logo and title instantly, and auto-close after 3 seconds
      window.addEventListener('message', (e) => {
        if (typeof e.data === 'string' && e.data.includes('Tally.FormSubmitted')) {
          const header = document.getElementById('xy-modal-header');
          if (header) {
            header.style.opacity = '0';
            setTimeout(() => { header.style.display = 'none'; }, 300);
          }
          
          // Auto-close the entire modal after 3 seconds to hide Tally branding
          setTimeout(() => {
            const modal = document.getElementById('xy-master-modal');
            const modalContent = document.getElementById('xy-modal-content');
            if (modal && modalContent) {
              modalContent.style.opacity = '0';
              modalContent.style.transform = 'translateY(-20px)';
              setTimeout(() => {
                modal.style.display = 'none';
                // Reset the header for the next time they open the modal
                if (header) {
                  header.style.display = 'block';
                  // small delay before restoring opacity so it doesn't flash
                  setTimeout(() => { header.style.opacity = '1'; }, 50);
                }
              }, 300);
            }
          }, 3000);
        }
      });
    </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('xy-master-modal');
  const modalContent = document.getElementById('xy-modal-content');
  const closeBtn = document.getElementById('xy-modal-close');
  
  // Find all links that we disabled earlier
  const buttons = document.querySelectorAll('a[href="javascript:void(0);"]');
  
  function openModal(e) {
    e.preventDefault();
    modal.style.display = 'flex';
    // Small delay to allow display:flex to apply before transitioning opacity
    setTimeout(() => {
      modal.style.opacity = '1';
      modalContent.style.transform = 'translateY(0)';
    }, 10);
  }
  
  function closeModal() {
    modal.style.opacity = '0';
    modalContent.style.transform = 'translateY(20px)';
    setTimeout(() => {
      modal.style.display = 'none';
    }, 300); // Wait for transition
  }

  // Wire buttons to open modal
  buttons.forEach(btn => {
    btn.addEventListener('click', openModal);
  });
  
  // Wire close button
  closeBtn.addEventListener('click', closeModal);
  
  // Close if clicking outside the modal content
  modal.addEventListener('click', (e) => {
    if(e.target === modal) {
      closeModal();
    }
  });
});
</script>


<script>
// DocWind Premium: Magnetic Buttons
document.addEventListener("DOMContentLoaded", () => {
  // Target all HubSpot buttons and our custom modal email button
  const magneticElements = document.querySelectorAll('.hs-button, a[href^="https://mail.google.com"]');
  
  magneticElements.forEach((el) => {
    // Add smooth transition for snapping back
    el.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, box-shadow 0.2s ease';
    
    el.addEventListener('mousemove', (e) => {
      const rect = el.getBoundingClientRect();
      // Calculate distance from center of button
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      
      // Pull strength (how far it moves)
      const pullX = 15; 
      const pullY = 15;
      
      const moveX = (x / (rect.width / 2)) * pullX;
      const moveY = (y / (rect.height / 2)) * pullY;
      
      el.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });

    el.addEventListener('mouseleave', () => {
      // Snap back to original position
      el.style.transform = 'translate(0px, 0px)';
    });
  });
});
</script>
